name: Deploy Preview Server

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - staging

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: preview-${{ github.event.pull_request.number || 'manual' }}
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          ASTRO_DATABASE_FILE: ./.astro/content.db

      - name: Test build output
        run: |
          echo "✅ Build completed successfully"
          ls -la dist/
          ls -la .astro/

      - name: Create deployment archive
        run: |
          tar -czf deployment.tar.gz \
            dist/ \
            .astro/ \
            package.json \
            package-lock.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-${{ github.sha }}
          path: deployment.tar.gz
          retention-days: 7

      - name: Deploy to preview server
        id: deploy
        run: |
          echo "url=https://preview-pr-${{ github.event.pull_request.number }}.example.com" >> $GITHUB_OUTPUT
          echo "✅ Preview deployment prepared"
          echo "📦 Artifact uploaded: preview-build-${{ github.sha }}"
          echo "🔗 Ready to deploy to your preview server"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.sha.substring(0, 7);
            
            const comment = `## 🚀 Preview Deployment Ready
            
            **Build:** \`${sha}\`
            **Artifact:** \`preview-build-${{ github.sha }}\`
            
            ### 📦 Deployment Artifact
            The preview build has been created and is ready for deployment.
            
            ### 🔧 To deploy to your preview server:
            
            1. Download the artifact from this workflow run
            2. Extract the archive on your preview server
            3. Install dependencies: \`npm install --production\`
            4. Start the server: \`npm start\`
            
            Or use Docker:
            \`\`\`bash
            docker build -t arandor-preview:pr-${prNumber} .
            docker run -d -p 4321:4321 \\
              -v arandor-data:/app/data \\
              -e ASTRO_DATABASE_FILE=/app/data/content.db \\
              arandor-preview:pr-${prNumber}
            \`\`\`
            
            ### 🔗 Preview URL
            Configure your preview server and update the environment URL in the workflow.
            
            ### 📚 Documentation
            - See [DEPLOYMENT.md](../blob/main/DEPLOYMENT.md) for detailed deployment instructions
            - Check [README.md](../blob/main/README.md) for configuration options
            
            ---
            *This is an automated preview deployment workflow.*`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

