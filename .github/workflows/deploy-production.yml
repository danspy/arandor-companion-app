name: Build and Deploy (Node server)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # default DB path (override by setting DB_PATH in the workflow or as a secret/env when needed)
  DB_PATH: "/srv/arandor/.astro/content.db"

jobs:
  deploy:
    name: Deploy to server (rsync -> build -> migrations -> restart)
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Ensure remote directories exist
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            set -e
            mkdir -p /srv/arandor
            mkdir -p \"\$(dirname \"${DB_PATH}\")\"
          "

      - name: Sync repository to server (excluding build artifacts and DB)
        run: |
          # Sync complete repository but exclude:
          # - node_modules (will be installed on server)
          # - dist (will be built on server)
          # - .astro (preserve existing database)
          # - .git (not needed on server)
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.astro/' \
            --exclude='.env' \
            --exclude='.env.local' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/"

      - name: Install dependencies and build on server
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e

            # Build in a temporary directory to avoid touching production database
            BUILD_DIR="/tmp/arandor-build-$$"
            echo "Building in temporary directory: $BUILD_DIR"
            mkdir -p "$BUILD_DIR"

            # Copy source files to build directory (exclude production .astro directory)
            echo "Copying source files to build directory..."
            rsync -a --exclude=".astro/" --exclude="dist/" --exclude="node_modules/" \
              /srv/arandor/ "$BUILD_DIR/"

            cd "$BUILD_DIR"

            echo "Installing dependencies..."
            npm install

            echo "Building application..."
            npm run build

            echo "Copying built files back to production..."
            # Copy dist directory to production
            rm -rf /srv/arandor/dist
            cp -r "$BUILD_DIR/dist" /srv/arandor/

            # Copy node_modules if needed (for server dependencies)
            echo "Updating production node_modules..."
            rsync -a --delete "$BUILD_DIR/node_modules/" /srv/arandor/node_modules/

            echo "Cleaning up build directory..."
            rm -rf "$BUILD_DIR"

            echo "Build completed successfully"
          '

      - name: Run DB creation + migration on server (backups + idempotent)
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            set -euo pipefail

            DB_PATH=\"${DB_PATH}\"
            MIGRATE_SQL=\"/srv/arandor/scripts/migrate-db.sql\"

            echo \"DB_PATH=\$DB_PATH\"
            echo \"MIGRATE_SQL=\$MIGRATE_SQL\"

            # Ensure parent directory exists (created earlier, but be defensive)
            mkdir -p \"\$(dirname \"\$DB_PATH\")\"

            # Ensure sqlite3 is present
            if ! command -v sqlite3 >/dev/null 2>&1; then
              echo \"sqlite3 not installed on server - install sqlite3 (sudo apt update && sudo apt install -y sqlite3) and re-run workflow.\"
              exit 0
            fi

            # Check if database exists and has data
            if [ -f \"\$DB_PATH\" ]; then
              echo \"Database file exists at \$DB_PATH\"
              
              # Check if User table exists and has data
              USER_COUNT=\$(sqlite3 \"\$DB_PATH\" \"SELECT COUNT(*) FROM User;\" 2>/dev/null || echo \"0\")
              echo \"User count in database: \$USER_COUNT\"
              
              if [ \"\$USER_COUNT\" -gt 0 ]; then
                echo \"Database has existing data (\$USER_COUNT users) - preserving and skipping migration\"
                echo \"Note: If you need to add new tables/columns, edit scripts/migrate-db.sql\"
                echo \"Current DB tables:\"
                sqlite3 \"\$DB_PATH\" \".tables\" || true
                exit 0
              else
                echo \"Database exists but is empty - will run migration\"
              fi
              
              # Backup current DB (timestamped)
              BACKUP=\"\${DB_PATH}.bak.\$(date +%s)\"
              cp -- \"\$DB_PATH\" \"\$BACKUP\"
              echo \"Backed up existing DB to \$BACKUP\"
            else
              echo \"No existing database found at \$DB_PATH - will be created by migration\"
            fi

            # Apply migration if SQL file exists
            # SQLite will create the database file if it doesn't exist
            if [ -f \"\$MIGRATE_SQL\" ]; then
              echo \"Applying SQL migration \$MIGRATE_SQL\"
              sqlite3 \"\$DB_PATH\" < \"\$MIGRATE_SQL\"
              echo \"Migration applied successfully\"
            else
              echo \"No migration script found; nothing to apply.\"
            fi

            # Show tables for debugging
            echo \"Current DB tables:\"
            sqlite3 \"\$DB_PATH\" \".tables\" || true
          "

      - name: Install server deps and restart service on remote
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            if [ -d /srv/arandor/dist/server ] && [ -f /srv/arandor/dist/server/package.json ]; then
              cd /srv/arandor/dist/server
              npm ci --production || true
            fi

            # Use the root-owned wrapper scripts exposed via sudoers (must be NOPASSWD for CI)
            sudo -n /usr/local/sbin/arandor-deploy-restart

            # Print service status for diagnostics via the status wrapper
            sudo -n /usr/local/sbin/arandor-deploy-status | sed -n "1,60p"
          '

      - name: Verify site (quick smoke test)
        run: |
          DEPLOY_DOMAIN="${{ secrets.DEPLOY_DOMAIN || 'arandor.app' }}"
          echo "Smoke test domain: $DEPLOY_DOMAIN"

          # show remote service status
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "sudo systemctl status arandor.service --no-pager -l | head -10"

          # Wait a few seconds for the service to start
          sleep 5

          # request the public HTTPS URL
          curl -I --max-time 10 "https://${DEPLOY_DOMAIN}"
