name: Build and Deploy (Node server)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    outputs:
      dist-path: ./dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Create database directory and initialize DB
        run: |
          mkdir -p ./data
          touch ./data/content.db

      - name: Build (server output)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to server (rsync -> restart systemd)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      # optional secret: set DEPLOY_DOMAIN in repo secrets to override default
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - name: Checkout (for package manifests)
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Ensure remote directory exists
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'mkdir -p /srv/arandor/dist /srv/arandor/uploads || true'

      - name: Sync dist and package manifests to server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/dist/"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./package.json ./package-lock.json "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/"

      - name: Install server deps and restart service on remote
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            # The standalone server build imports its runtime dependencies (astro,
            # @astrojs/db, marked, ...) from /srv/arandor/node_modules, so they must
            # match the package-lock.json that produced dist/.
            cd /srv/arandor
            npm ci --omit=dev --no-audit --no-fund

            # Use the root-owned wrapper scripts exposed via sudoers (must be NOPASSWD for CI)
            sudo -n /usr/local/sbin/arandor-deploy-restart

            # Print service status for diagnostics via the status wrapper
            sudo -n /usr/local/sbin/arandor-deploy-status | sed -n "1,60p"
          '

      - name: Verify site (quick smoke test)
        run: |
          # Default to arandor.app if DEPLOY_DOMAIN secret is not set
          DEPLOY_DOMAIN="${DEPLOY_DOMAIN:-arandor.app}"
          echo "Smoke test domain: $DEPLOY_DOMAIN"

          # show remote service status (non-interactive)
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "sudo -n /usr/local/sbin/arandor-deploy-status | sed -n '1,10p'"

          # request the public HTTPS URL; fail the workflow if the site does not answer 2xx/3xx
          curl -fsSI --retry 5 --retry-delay 5 --retry-all-errors --max-time 10 "https://${DEPLOY_DOMAIN}" | head -1
