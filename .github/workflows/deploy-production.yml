name: Build and Deploy (Node server)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    outputs:
      dist-path: ./dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build (server output)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to server (rsync -> restart systemd)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          # Add the private key (set this secret in repo settings)
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Ensure remote directory exists
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "mkdir -p /srv/arandor/dist"
        # expects secrets: SERVER_USER (e.g. deploy) and SERVER_HOST (ip/floating ip)

      - name: Sync dist to server
        run: |
          # rsync the built dist directory to the server as the deploy user
          # NOTE: Only the dist/ folder is synced. Database files are NOT affected.
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/dist/"

      - name: Install server deps and restart service on remote
        run: |
          # Install production deps for the server bundle (if package.json exists) and restart systemd service
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /srv/arandor/dist/server 2>/dev/null || exit 0; \
             if [ -f package.json ]; then npm ci --production || true; fi; \
             sudo systemctl restart arandor.service && sudo systemctl status arandor.service --no-pager"
