name: Build and Deploy (Node server)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # default DB path (override by setting DB_PATH in the workflow or as a secret/env when needed)
  DB_PATH: "/srv/arandor/.astro/content.db"

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    outputs:
      dist-path: ./dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build (server output)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload migration scripts
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: scripts

  deploy:
    name: Deploy to server (rsync -> migrations -> restart)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Download migration scripts
        uses: actions/download-artifact@v4
        with:
          name: scripts
          path: ./scripts

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Ensure remote directories exist
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            mkdir -p /srv/arandor/dist
            mkdir -p /srv/arandor/scripts
            mkdir -p "$(dirname "'"${DB_PATH}"'")"
          '

      - name: Sync dist to server
        run: |
          # Sync only the build output; it does not touch /srv/arandor/.astro
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/dist/"

      - name: Sync migration scripts to server
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./scripts/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/scripts/"

      - name: Run DB creation + migration on server (backups + idempotent)
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -euo pipefail

            DB_PATH="'"${DB_PATH}"'"
            MIGRATE_SQL="/srv/arandor/scripts/migrate-db.sql"
            MIGRATE_SH="/srv/arandor/scripts/migrate.sh"

            echo "DB_PATH=$DB_PATH"
            echo "MIGRATE_SQL=$MIGRATE_SQL"
            echo "MIGRATE_SH=$MIGRATE_SH"

            # Ensure parent directory exists (created earlier, but be defensive)
            mkdir -p "$(dirname "$DB_PATH")"

            # Ensure sqlite3 is present
            if ! command -v sqlite3 >/dev/null 2>&1; then
              echo "sqlite3 not installed on server - install sqlite3 (sudo apt update && sudo apt install -y sqlite3) and re-run workflow."
              exit 0
            fi

            # If DB does not exist, create an empty DB file as the deploy user
            if [ ! -f "$DB_PATH" ]; then
              echo "Database not found at $DB_PATH; creating an empty DB file."
              touch "$DB_PATH"
              echo "Created $DB_PATH"
            fi

            # Ensure DB is writable by deploy (we are running as deploy via ssh)
            # Backup current DB (timestamped)
            BACKUP="${DB_PATH}.bak.$(date +%s)"
            cp -- "$DB_PATH" "$BACKUP"
            echo "Backed up DB to $BACKUP"

            # Apply migration: if migrate.sh exists, use it (it should be idempotent); otherwise use migrate-db.sql directly.
            if [ -f "$MIGRATE_SH" ]; then
              chmod +x "$MIGRATE_SH" || true
              echo "Running migration script $MIGRATE_SH"
              "$MIGRATE_SH" "$DB_PATH" "$MIGRATE_SQL"
            elif [ -f "$MIGRATE_SQL" ]; then
              echo "Applying SQL migration $MIGRATE_SQL"
              sqlite3 "$DB_PATH" < "$MIGRATE_SQL"
            else
              echo "No migration script/sql found; nothing to apply."
            fi

            # Show tables for debugging
            echo "Current DB tables:"
            sqlite3 "$DB_PATH" ".tables" || true
          '

      - name: Install server deps and restart service on remote
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            # Install production dependencies inside the server bundle (if present)
            if [ -d /srv/arandor/dist/server ] && [ -f /srv/arandor/dist/server/package.json ]; then
              cd /srv/arandor/dist/server
              npm ci --production || true
            fi

            # Restart service using root-owned, sudoers-approved wrapper script (must be NOPASSWD)
            sudo -n /usr/local/sbin/arandor-deploy-restart

            # Print service status via wrapper for diagnostics
            sudo -n /usr/local/sbin/arandor-deploy-status | sed -n "1,60p"
          '

      - name: Verify site (quick smoke test)
        run: |
          DEPLOY_DOMAIN="${{ secrets.DEPLOY_DOMAIN || 'arandor.app' }}"
          echo "Smoke test domain: $DEPLOY_DOMAIN"

          # show remote service status
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "sudo -n /usr/local/sbin/arandor-deploy-status | sed -n '1,10p'"

          # request the public HTTPS URL
          curl -I --max-time 10 "https://${DEPLOY_DOMAIN}"
