name: Build and Deploy (Node server)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    outputs:
      dist-path: ./dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build (server output)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to server (rsync -> restart systemd)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Ensure remote directory exists
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'mkdir -p /srv/arandor/dist && chown -R $USER:$USER /srv/arandor || true'
        # expects secrets: SERVER_USER (e.g. deploy) and SERVER_HOST (ip/floating ip)

      - name: Sync dist to server
        run: |
          # rsync the built dist directory to the server as the deploy user
          # NOTE: Only the dist/ folder is synced. Database files (.astro/content.db) are NOT affected.
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/dist/"

      - name: Install server deps and restart service on remote
        # run non-interactive; relies on passwordless sudo for the restart wrapper scripts
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            # Install production deps in the server bundle as the deploy user (if package.json exists)
            if [ -d /srv/arandor/dist/server ] && [ -f /srv/arandor/dist/server/package.json ]; then
              cd /srv/arandor/dist/server
              npm ci --production || true
            fi

            # Restart the service using the root-owned wrapper exposed via sudoers (must be NOPASSWD for CI)
            sudo -n /usr/local/sbin/arandor-deploy-restart

            # Optional: print service status for diagnostics (uses the status wrapper)
            sudo -n /usr/local/sbin/arandor-deploy-status | sed -n "1,60p"
          '

      - name: Verify site (quick smoke test)
        run: |
          # check that the remote service is listening (via ssh) and that the public HTTPS returns 200 (use -k if needed)
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'sudo -n /usr/local/sbin/arandor-deploy-status | sed -n "1,10p"'
          curl -I --max-time 10 https://${{ secrets.DEPLOY_DOMAIN }}
