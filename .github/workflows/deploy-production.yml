name: Build and Deploy (Node server)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    outputs:
      dist-path: ./dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build (server output)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload migration scripts
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: scripts

  deploy:
    name: Deploy to server (rsync -> migrations -> restart systemd)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      # optional secret: set DEPLOY_DOMAIN in repo secrets to override default
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
      # default DB path on server — change if your DB is located somewhere else
      DB_PATH: "/srv/arandor/.astro/content.db"
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Download migration scripts
        uses: actions/download-artifact@v4
        with:
          name: scripts
          path: ./scripts

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Ensure remote directory exists
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'mkdir -p /srv/arandor/dist || true'

      - name: Sync dist to server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/dist/"

      - name: Sync migration scripts to server
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./scripts/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/arandor/scripts/"

      - name: Run database migration (if script present and sqlite3 available)
        run: |
          # run migration on the server; checks for sqlite3 and backups DB before applying
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            DB_PATH="${DB_PATH:-/srv/arandor/.astro/content.db}"
            MIGRATE_SQL="/srv/arandor/scripts/migrate-db.sql"

            echo "DB_PATH=$DB_PATH"
            echo "MIGRATE_SQL=$MIGRATE_SQL"

            # Ensure DB directory exists
            mkdir -p "$(dirname "$DB_PATH")"

            if [ ! -f "$MIGRATE_SQL" ]; then
              echo "No migration script found at $MIGRATE_SQL; skipping migration."
              exit 0
            fi

            if ! command -v sqlite3 >/dev/null 2>&1; then
              echo "sqlite3 not installed on server; skipping migration."
              echo "Install sqlite3 on the server (sudo apt update && sudo apt install -y sqlite3) and re-run the workflow to apply migrations."
              exit 0
            fi

            if [ ! -f "$DB_PATH" ]; then
              echo "Database file $DB_PATH does not exist. Creating empty DB file."
              # create an empty DB file as deploy so permissions are correct
              mkdir -p "$(dirname "$DB_PATH")"
              touch "$DB_PATH"
              chown $USER:$USER "$DB_PATH" || true
            fi

            # Backup current DB
            BACKUP="${DB_PATH}.bak.$(date +%s)"
            echo "Backing up DB to $BACKUP"
            cp -- "$DB_PATH" "$BACKUP"
            echo "Applying migration SQL..."
            sqlite3 "$DB_PATH" < "$MIGRATE_SQL"
            echo "Migration applied successfully."
          '

      - name: Install server deps and restart service on remote
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            if [ -d /srv/arandor/dist/server ] && [ -f /srv/arandor/dist/server/package.json ]; then
              cd /srv/arandor/dist/server
              npm ci --production || true
            fi

            # Use the root-owned wrapper scripts exposed via sudoers (must be NOPASSWD for CI)
            sudo -n /usr/local/sbin/arandor-deploy-restart

            # Print service status for diagnostics via the status wrapper
            sudo -n /usr/local/sbin/arandor-deploy-status | sed -n "1,60p"
          '

      - name: Verify site (quick smoke test)
        run: |
          DEPLOY_DOMAIN="${DEPLOY_DOMAIN:-arandor.app}"
          echo "Smoke test domain: $DEPLOY_DOMAIN"
          ssh -o StrictHostKeyChecking=no "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "sudo -n /usr/local/sbin/arandor-deploy-status | sed -n '1,10p'"
          curl -I --max-time 10 "https://${DEPLOY_DOMAIN}"
