name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://arandor.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          ASTRO_DATABASE_FILE: ./.astro/content.db

      - name: Run tests
        run: |
          # Add test commands here when tests are available
          echo "✅ Tests passed (no tests configured yet)"

      - name: Create deployment package
        run: |
          tar -czf production-deployment.tar.gz \
            dist/ \
            .astro/ \
            package.json \
            package-lock.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: production-deployment.tar.gz
          retention-days: 30

      - name: Deploy notification
        run: |
          echo "🚀 Production build created successfully"
          echo "📦 Artifact: production-build-${{ github.sha }}"
          echo "🔗 Ready for deployment to production server"

  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test Docker image
        run: |
          docker build -t arandor-companion:latest .
          docker run -d -p 4321:4321 --name arandor-test arandor-companion:latest
          sleep 10
          curl -f http://localhost:4321 || exit 1
          docker stop arandor-test
          docker rm arandor-test
          echo "✅ Production Docker image verified"

