name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://arandor.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          ASTRO_DATABASE_FILE: ./.astro/content.db

      - name: Run tests
        run: |
          # Add test commands here when tests are available
          echo "✅ Tests passed (no tests configured yet)"

      - name: Verify build output
        run: |
          echo "✅ Build completed successfully"
          ls -la dist/
          ls -la .astro/
          echo "Checking for required files..."
          test -f dist/server/entry.mjs && echo "✅ Server entry file exists"
          test -d .astro && echo "✅ Database directory exists"

      - name: Create deployment package
        run: |
          tar -czf production-deployment.tar.gz \
            dist/ \
            .astro/ \
            package.json \
            package-lock.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: production-deployment.tar.gz
          retention-days: 30

      - name: Deploy notification
        run: |
          echo "🚀 Production build created successfully"
          echo "📦 Artifact: production-build-${{ github.sha }}"
          echo "🔗 Ready for deployment to production server"
          echo ""
          echo "To deploy:"
          echo "1. Download the artifact from this workflow run"
          echo "2. Extract on your production server"
          echo "3. Run: npm install --production"
          echo "4. Start: npm start"
          echo ""
          echo "See DEPLOYMENT.md for detailed instructions"

