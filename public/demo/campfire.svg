<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Demo diary cover for the seeded dev database (db/seed.ts). -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.6" stop-color="#14183a"/>
      <stop offset="1" stop-color="#1d1426"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#e0662a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e0662a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff2c0"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#d9431e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <g fill="#fff8e6" opacity="0.8">
    <circle cx="140" cy="90" r="1.5"/><circle cx="380" cy="60" r="1.2"/><circle cx="620" cy="130" r="1.6"/>
    <circle cx="900" cy="70" r="1.1"/><circle cx="1180" cy="110" r="1.5"/><circle cx="1450" cy="60" r="1.3"/>
    <circle cx="260" cy="200" r="1"/><circle cx="1320" cy="220" r="1"/><circle cx="760" cy="230" r="0.9"/>
  </g>
  <!-- Pine silhouettes -->
  <g fill="#0a0d1c">
    <path d="M0 640 L60 380 L120 640Z"/><path d="M90 660 L170 300 L250 660Z"/><path d="M220 650 L280 420 L340 650Z"/>
    <path d="M1250 650 L1320 340 L1390 650Z"/><path d="M1360 660 L1440 280 L1520 660Z"/><path d="M1480 650 L1550 400 L1620 650Z"/>
  </g>
  <rect y="620" width="1600" height="280" fill="#120c10"/>
  <ellipse cx="800" cy="640" rx="560" ry="300" fill="url(#fireGlow)"/>
  <!-- Logs and fire -->
  <g stroke-linecap="round">
    <line x1="700" y1="700" x2="900" y2="650" stroke="#3a2416" stroke-width="26"/>
    <line x1="700" y1="650" x2="900" y2="700" stroke="#2e1c12" stroke-width="26"/>
  </g>
  <path d="M800 470 C760 560 720 600 745 665 L855 665 C880 600 840 560 800 470Z" fill="url(#flame)"/>
  <path d="M770 540 C745 600 750 640 770 665 L830 665 C850 630 845 600 820 560 C815 600 790 600 770 540Z" fill="#fff2c0" opacity="0.85"/>
  <!-- Adventurers around the fire -->
  <g fill="#0b0709">
    <path d="M470 760 C470 690 500 650 540 650 C580 650 600 690 600 760Z"/><circle cx="538" cy="620" r="30"/>
    <path d="M520 600 L538 545 L556 600Z"/>
    <path d="M1010 760 C1010 690 1040 650 1080 650 C1120 650 1140 690 1140 760Z"/><circle cx="1078" cy="622" r="28"/>
    <path d="M300 790 C300 730 330 700 370 700 C410 700 430 730 430 790Z"/><circle cx="368" cy="675" r="25"/>
    <rect x="1180" y="560" width="8" height="200" transform="rotate(12 1184 660)"/>
  </g>
  <g fill="#ffb347" opacity="0.9">
    <circle cx="815" cy="430" r="3"/><circle cx="780" cy="390" r="2"/><circle cx="830" cy="350" r="2.5"/><circle cx="795" cy="300" r="1.6"/>
